id: io.github.o-min222.todo
name: Todo
version: 0.1.0
min_app_version: "1.4.0"
manifest_version: 2
entry: dap_todo.plugin:activate
description: 할 일을 리스트와 칸반으로 관리하고, 붙여넣은 글·이미지·메일에서 할 일 초안을 뽑아 확인 후 등록합니다.
