<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>할 일</title>
<style>
  /* DAP은 플러그인 문서에 토큰을 주입하지 않는다 — 테마는 prefers-color-scheme으로 직접 대응. */
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1b1d21; --muted: #6b7280;
    --line: #e3e6ea; --accent: #3b82f6; --danger: #dc2626; --warn: #b45309;
    --hi-bg: #fee2e2; --hi-fg: #b91c1c;
    --md-bg: #fef3c7; --md-fg: #92400e;
    --lo-bg: #e0e7ff; --lo-fg: #3730a3;
    --track: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --card: #1f2229; --fg: #e8eaed; --muted: #9aa1ac;
      --line: #2c3038; --accent: #60a5fa; --danger: #f87171; --warn: #fbbf24;
      --hi-bg: #4a1d1d; --hi-fg: #fca5a5;
      --md-bg: #46330f; --md-fg: #fcd34d;
      --lo-bg: #262a52; --lo-fg: #a5b4fc;
      --track: #2c3038;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  button {
    font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; }
  button.link:hover { color: var(--danger); }
  input, textarea, select {
    font: inherit; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px;
  }
  .grow { flex: 1; }

  /* ── 제목표시줄 ──
   * 팔레트 창은 프레임리스(palette-window.ts: frame ?? false)라 OS 타이틀바가 없다.
   * 직접 그리고, 빈 영역은 창 이동용 드래그 영역으로 준다. */
  .titlebar {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 6px 0 13px; height: 38px; background: var(--card);
    border-bottom: 1px solid var(--line); -webkit-app-region: drag; user-select: none;
  }
  .titlebar .name { font-size: 13px; font-weight: 600; letter-spacing: -.2px; }
  .titlebar .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); flex: none; }
  .titlebar .nums { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; overflow: hidden; }
  .titlebar .close {
    -webkit-app-region: no-drag; border: none; background: none; color: var(--muted);
    font-size: 15px; line-height: 1; padding: 7px 10px; border-radius: 7px; flex: none;
  }
  .titlebar .close:hover { background: var(--hi-bg); color: var(--hi-fg); }
  .statusbar { flex: none; background: var(--card); }
  .stat { display: flex; align-items: baseline; gap: 3px; white-space: nowrap; }
  .stat b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11px; }
  .stat.alert b { color: var(--danger); }
  .stat.today b { color: var(--warn); }
  .stat.hold b { color: var(--muted); }
  .bar { height: 3px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
  .sep { width: 1px; align-self: stretch; background: var(--line); }

  main { flex: 1; overflow: auto; padding: 12px; }

  /* ── 이번 주 처리할 건 ──
     칸반이 주인공이라 위쪽은 짧게 — 지금 손대야 하는 것만 몇 줄. */
  .focus { margin-bottom: 12px; }
  .focus h2 {
    display: flex; align-items: center; gap: 6px; margin: 0 0 6px 2px; padding: 2px 0;
    font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none;
  }
  .focus h2:hover { color: var(--accent); }
  .focus h2 .n { color: var(--fg); }
  .focus h2 .caret { width: 10px; display: inline-block; }
  .focus .f {
    display: flex; gap: 8px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 8px; padding: 6px 10px; margin-bottom: 4px; cursor: pointer;
  }
  .focus .f:hover { border-color: var(--accent); }
  .focus .f.over { border-left-color: var(--danger); }
  .focus .f.today { border-left-color: var(--warn); }
  .focus .f .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus .more { font-size: 11px; color: var(--muted); padding-left: 4px; }

  /* ── 중요도 ──
     배경 채운 알약 대신 얇은 테두리 — 화면에 칩이 여럿 겹치면 알약은 금세 시끄러워진다. */
  .pri {
    font-size: 11px; padding: 0 6px; border-radius: 4px; white-space: nowrap;
    font-weight: 600; border: 1px solid currentColor; line-height: 16px;
  }
  .pri.high { color: var(--hi-fg); }
  .pri.medium { color: var(--md-fg); }
  .pri.low { color: var(--lo-fg); }
  .pri.hold { color: var(--muted); }

  /* 메모·기록 유무는 이모지 대신 작은 글자 라벨로. */
  .tagmark {
    font-size: 10px; color: var(--muted); letter-spacing: .2px; white-space: nowrap;
    padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; line-height: 15px;
  }
  .row.held { opacity: .72; border-style: dashed; }

  /* ── 리스트 ── */
  .row { display: flex; gap: 9px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 6px; }
  .row .title { flex: 1; cursor: pointer; }
  .row.done .title { text-decoration: line-through; color: var(--muted); }
  .due { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .due.over { color: var(--danger); font-weight: 600; }
  .due.today { color: var(--warn); font-weight: 600; }
  .tag { font-size: 11px; color: var(--muted); }

  /* ── 칸반 ── */
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; align-items: start; }
  /* 보류 컬럼은 한 톤 죽여 "지금 안 하는 것"으로 읽히게 한다. */
  .col.hold { background: transparent; border-style: dashed; }
  .col.hold .chip { opacity: .72; }
  .col { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 150px; }
  .col h2 { margin: 2px 4px 8px; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  .col.over { border-color: var(--accent); }
  .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; cursor: grab; }
  .chip:active { cursor: grabbing; }
  .chip .top { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; }
  .chip .meta { display: flex; gap: 8px; align-items: center; }
  .chip .note {
    color: var(--muted); font-size: 11px; margin-top: 3px; padding-left: 6px;
    border-left: 2px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .note { color: var(--muted); font-size: 11px; }

  /* ── 시트(노션 페이지 / 초안 확인) ── */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 18px; }
  .sheet > div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 580px; max-height: 100%; display: flex; flex-direction: column; }
  .sheet h2 { margin: 0; padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .sheet .body { padding: 14px 18px; overflow: auto; flex: 1; }
  .sheet .foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }

  /* 노션 페이지 느낌: 제목은 큼직한 무테, 속성은 라벨/값 2열 */
  .page-title { width: 100%; border: none; background: none; font-size: 22px; font-weight: 700; padding: 2px 0 8px; }
  .page-title:focus { outline: none; }
  .props { display: grid; grid-template-columns: 74px 1fr; gap: 7px 10px; align-items: center; padding: 6px 0 12px; border-bottom: 1px solid var(--line); }
  .props .k { color: var(--muted); font-size: 12px; }
  .props .v { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .props .v input[type=text] { flex: 1; min-width: 90px; }
  .seg button { padding: 3px 9px; font-size: 12px; }
  .seg button.on.high { background: var(--hi-bg); color: var(--hi-fg); border-color: var(--hi-fg); }
  .seg button.on.medium { background: var(--md-bg); color: var(--md-fg); border-color: var(--md-fg); }
  .seg button.on.low { background: var(--lo-bg); color: var(--lo-fg); border-color: var(--lo-fg); }
  .seg button.on.none { background: var(--accent); color: #fff; border-color: var(--accent); }
  .page-body { width: 100%; min-height: 150px; border: none; background: none; resize: vertical; padding: 12px 0 0; line-height: 1.65; }
  .page-body:focus { outline: none; }
  /* DAP으로 처리한 작업 기록 — 사람이 쓴 본문과 섞이지 않게 아래에 따로 쌓는다. */
  .acts { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .acts h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .acts h3 span { color: var(--fg); }
  .act { border-left: 2px solid var(--line); padding: 0 0 8px 9px; margin-bottom: 8px; }
  .act .when { font-size: 11px; color: var(--muted); }
  .act .txt { font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .act .att {
    display: flex; gap: 6px; align-items: baseline; font-size: 11px; color: var(--accent);
    margin-top: 3px; overflow: hidden;
  }
  .act .att .k {
    flex: none; color: var(--muted); font-size: 10px; border: 1px solid var(--line);
    border-radius: 3px; padding: 0 4px; line-height: 14px;
  }
  .act .att { white-space: nowrap; }
  .hintline { color: var(--muted); font-size: 11px; min-height: 16px; }
  .hintline b { color: var(--accent); }

  /* 인라인 추가 — 목록/컬럼 안에서 바로 열리는 진입점. 버튼을 따로 찾아갈 필요가 없다. */
  .addrow {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    color: var(--muted); background: none; border: 1px dashed var(--line); border-radius: 9px;
    padding: 8px 10px;
  }
  .addrow:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }
  .col .addrow { padding: 6px 9px; font-size: 12px; }

  .draft { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
  .draft input[type=text] { flex: 1; }
  .empty { color: var(--muted); text-align: center; padding: 34px 12px; }
  pre { white-space: pre-wrap; word-break: break-all; color: var(--muted); font-size: 12px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--track); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -1px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="titlebar">
  <span class="dot"></span>
  <span class="name">할 일</span>
  <span class="grow"></span>
  <div class="nums" id="stats"></div>
  <button class="close" id="close" title="닫기">×</button>
</div>
<div class="bar"><i id="bar" style="width:0%"></i></div>

<main id="main"><div class="empty">불러오는 중…</div></main>
<input id="file" type="file" accept="image/*" hidden />

<script>
const bridge = window.dapPalette;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let tasks = [];
let focus = null;
let focusCollapsed = false;
let stats = null;

const COLUMNS = [
  { id: "todo", label: "할 일" },
  { id: "doing", label: "진행 중" },
  { id: "hold", label: "보류" },
  { id: "done", label: "완료" },
];
const PRI_LABEL = { high: "높음", medium: "보통", low: "낮음" };
const send = (cmd) => bridge.postMessage({ type: "todo.cmd", cmd });

function dueInfo(task) {
  if (!task.due) return { text: "", cls: "" };
  const d = new Date(task.due);
  if (Number.isNaN(d.getTime())) return { text: "", cls: "" };
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hasTime = task.due.includes("T");
  const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const text = sameDay ? (hasTime ? `오늘 ${hm}` : "오늘") : `${d.getMonth() + 1}/${d.getDate()}`;
  const cls = task.status !== "done" && d < now && !sameDay ? "over" : sameDay ? "today" : "";
  return { text, cls };
}
const priChip = (p) => (p ? `<span class="pri ${p}">${PRI_LABEL[p]}</span>` : "");

/* ── 상태표시줄 ── */
function renderStats() {
  if (!stats) return;
  const cell = (n, label, cls = "") => `<div class="stat ${cls}"><b>${n}</b><span>${label}</span></div>`;
  // 제목표시줄 안이라 폭이 귀하다 — 전체 건수는 아래 진행 막대가 이미 말해준다.
  const parts = [cell(stats.todo, "할 일"), cell(stats.doing, "진행"), cell(stats.done, "완료")];
  if (stats.hold) parts.splice(2, 0, cell(stats.hold, "보류", "hold"));
  const alerts = [];
  if (stats.overdue) alerts.push(cell(stats.overdue, "지난 마감", "alert"));
  if (stats.today) alerts.push(cell(stats.today, "오늘 마감", "today"));
  if (stats.high) alerts.push(`<div class="stat"><span class="pri high">중요 ${stats.high}</span></div>`);
  $("stats").innerHTML = parts.join("") + (alerts.length ? `<div class="sep"></div>${alerts.join("")}` : "");
  $("bar").style.width = `${stats.percent}%`;
}

/* ── 목록 / 칸반 ── */
function render() {
  renderStats();
  const main = $("main");
  main.innerHTML = "";
  renderFocus(main);
  renderKanban(main);
}

/** 이번 주에 손대야 하는 것들 — 칸반 위에 먼저. 누르면 그 항목이 열린다. */
function renderFocus(main) {
  if (!focus?.items?.length) return;
  const box = document.createElement("section");
  box.className = "focus";
  // 접어두면 헤더 한 줄만 남고 칸반이 그만큼 넓어진다. 상태는 저장돼 다음에도 유지된다.
  const head = document.createElement("h2");
  head.innerHTML =
    `<span class="caret">${focusCollapsed ? "▸" : "▾"}</span>` +
    `<span>이번 주 처리할 건</span><span class="n">${focus.total}</span>`;
  head.addEventListener("click", () =>
    bridge.postMessage({ type: "todo.focusToggle", collapsed: !focusCollapsed }));
  box.append(head);
  if (focusCollapsed) {
    main.append(box);
    return;
  }
  for (const t of focus.items) {
    const info = dueInfo(t);
    const row = document.createElement("div");
    row.className = "f" + (info.cls ? ` ${info.cls}` : "");
    row.innerHTML =
      priChip(t.priority) +
      `<span class="t">${esc(t.title)}</span>` +
      (t.notes?.trim() ? `<span class="tagmark">메모</span>` : "") +
      (info.text ? `<span class="due ${info.cls}">${info.text}</span>` : "");
    row.addEventListener("click", () => openPage(t));
    box.append(row);
  }
  if (focus.total > focus.items.length) {
    const more = document.createElement("div");
    more.className = "more";
    more.textContent = `+${focus.total - focus.items.length}건 더 — 아래 칸반에서 확인`;
    box.append(more);
  }
  main.append(box);
}

/** 목록/컬럼 안에 놓는 인라인 추가 버튼. status를 넘겨 그 컬럼으로 바로 들어가게 한다. */
function addRow(label, status) {
  const b = document.createElement("button");
  b.className = "addrow";
  b.innerHTML = `<span>+</span><span>${label}</span>`;
  b.addEventListener("click", () => openPage(null, status));
  return b;
}

function renderKanban(main) {
  if (!tasks.length) {
    const hint = document.createElement("div");
    hint.className = "empty";
    hint.innerHTML = "아직 할 일이 없어요.<br />아래 컬럼에서 바로 추가하거나, 펫에게 <b>“할 일 추가 …”</b>라고 말해보세요.";
    main.append(hint);
  }
  const board = document.createElement("div");
  board.className = "board";
  // 노션 보드처럼 중요도 높은 것이 위로.
  const rank = { high: 0, medium: 1, low: 2, "": 3 };
  for (const col of COLUMNS) {
    const box = document.createElement("section");
    box.className = "col" + (col.id === "hold" ? " hold" : "");
    const items = tasks.filter((x) => x.status === col.id)
      .sort((a, b) => rank[a.priority ?? ""] - rank[b.priority ?? ""] || a.order - b.order);
    box.innerHTML = `<h2><span>${col.label}</span><span>${items.length}</span></h2>`;
    for (const t of items) {
      const info = dueInfo(t);
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.draggable = true;
      const note = t.notes?.trim();
      chip.innerHTML =
        (t.priority ? `<div class="top">${priChip(t.priority)}</div>` : "") +
        `<div>${esc(t.title)}</div>` +
        // 노트가 있으면 첫 줄을 미리 보여준다 — 안에 뭐가 있는지 열기 전에 알 수 있게.
        (note ? `<div class="note">${esc(note.split("\n")[0].slice(0, 60))}</div>` : "") +
        // 열지 않고도 DAP이 뭘 붙여놨는지 보이게.
        (t.activity?.length ? `<div class="note">기록 ${t.activity.length}건</div>` : "") +
        (info.text || t.tags?.length
          ? `<div class="meta">${info.text ? `<span class="due ${info.cls}">${info.text}</span>` : ""}` +
            `${t.tags?.length ? `<span class="tag">${t.tags.map((x) => "#" + esc(x)).join(" ")}</span>` : ""}</div>`
          : "");
      chip.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", t.id));
      // 한 번 클릭으로 연다. 드래그와 안 겹치도록 실제로 끌린 경우에는 열지 않는다.
      let dragged = false;
      chip.addEventListener("dragstart", () => { dragged = true; });
      chip.addEventListener("dragend", () => { setTimeout(() => { dragged = false; }, 0); });
      chip.addEventListener("click", () => { if (!dragged) openPage(t); });
      box.append(chip);
    }
    box.append(addRow("추가", col.id));
    box.addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("over"); });
    box.addEventListener("dragleave", () => box.classList.remove("over"));
    box.addEventListener("drop", (e) => {
      e.preventDefault();
      box.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain");
      if (id) send({ type: "move", id, status: col.id });
    });
    board.append(box);
  }
  main.append(board);
}

/* ── 노션 페이지형 입력창 ──
 * 본문을 치면 마감·중요도·태그가 위 속성칸에 자동으로 채워진다(로컬 파싱, 즉시).
 * 사용자가 직접 건드린 속성은 자동 채우기가 다시 덮어쓰지 않는다.
 * [등록]을 누르면 AI가 한 번 검토·정리해서 넣는다.
 */
let hintSeq = 0;
let pendingHints = null;

function openPage(existing, status) {
  const editing = !!existing;
  const draft = {
    title: existing?.title ?? "",
    notes: existing?.notes ?? "",
    due: existing?.due ?? "",
    priority: existing?.priority ?? "",
    tags: [...(existing?.tags ?? [])],
    // 새로 만들면 열린 컬럼의 상태를, 편집이면 원래 상태를 기본값으로.
    status: existing?.status ?? status ?? "todo",
  };
  const touched = editing ? { due: true, priority: true, tags: true } : {};

  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = `<div>
    <div class="body">
      <input class="page-title" id="p-title" placeholder="제목 없음" />
      <div class="props">
        <div class="k">상태</div>
        <div class="v seg" id="p-status">
          <button data-s="todo">할 일</button>
          <button data-s="doing">진행 중</button>
          <button data-s="hold">보류</button>
          <button data-s="done">완료</button>
        </div>
        <div class="k">중요도</div>
        <div class="v seg" id="p-pri">
          <button data-p="" class="none">없음</button>
          <button data-p="high" class="high">높음</button>
          <button data-p="medium" class="medium">보통</button>
          <button data-p="low" class="low">낮음</button>
        </div>
        <div class="k">마감</div><div class="v"><input type="datetime-local" id="p-due" /></div>
        <div class="k">태그</div><div class="v"><input type="text" id="p-tags" placeholder="쉼표로 구분" /></div>
      </div>
      <textarea class="page-body" id="p-body" placeholder="내용을 적어보세요. 예: 내일 오후 3시까지 급하게 보고서 정리 #업무&#10;&#10;메일이나 메모를 그대로 붙여넣어도 돼요. 이미지는 붙여넣거나 끌어다 놓으세요."></textarea>
      <div id="p-activity"></div>
      <div class="hintline" id="p-src">
        붙여넣기·이미지 끌어놓기 지원 ·
        <button class="link" id="p-img">이미지 열기</button> ·
        <button class="link" id="p-mail">메일에서 가져오기</button>
      </div>
    </div>
    <div class="foot">
      <span class="hintline" id="p-hint"></span>
      <span class="grow"></span>
      <button id="p-cancel">취소</button>
      <button id="p-ok" class="active">${editing ? "저장" : "등록"}</button>
    </div>
  </div>`;
  document.body.append(sheet);

  const el = (id) => sheet.querySelector("#" + id);
  // DAP으로 처리한 작업 기록. 사람이 쓰는 본문과 섞이면 안 되니 아래 별도 영역에 쌓는다.
  const acts = existing?.activity ?? [];
  if (acts.length) {
    el("p-activity").innerHTML =
      `<div class="acts"><h3>작업 기록 <span>${acts.length}</span></h3>` +
      [...acts].reverse().slice(0, 20).map((a) => {
        const when = String(a.at ?? "").slice(5, 16).replace("T", " ");
        const links = (a.links ?? []).map((u) => `<div class="att"><span class="k">링크</span>${esc(u)}</div>`).join("");
        const files = (a.files ?? []).map((f) => `<div class="att"><span class="k">파일</span>${esc(f)}</div>`).join("");
        return `<div class="act"><div class="when">${esc(when)}${a.by ? ` · ${esc(a.by)}` : ""}</div>` +
          `<div class="txt">${esc(a.text ?? "")}</div>${links}${files}</div>`;
      }).join("") + `</div>`;
  }

  el("p-title").value = draft.title;
  el("p-body").value = draft.notes;
  el("p-due").value = draft.due && draft.due.includes("T") ? draft.due : "";
  el("p-tags").value = draft.tags.join(", ");
  const paintPri = () => [...el("p-pri").children].forEach((b) => b.classList.toggle("on", b.dataset.p === draft.priority));
  paintPri();
  const paintStatus = () => [...el("p-status").children].forEach((b) => {
    const on = b.dataset.s === draft.status;
    b.classList.toggle("on", on);
    b.classList.toggle("none", on); // .seg button.on.none = 강조색 (중요도 칩과 공용 스타일)
  });
  paintStatus();
  el("p-status").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    draft.status = b.dataset.s;
    paintStatus();
  });

  el("p-pri").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    draft.priority = b.dataset.p;
    touched.priority = true;
    paintPri();
  });
  el("p-due").addEventListener("input", () => { touched.due = true; });
  el("p-tags").addEventListener("input", () => { touched.tags = true; });

  // 타이핑 → 로컬 파서 왕복(디바운스) → 안 건드린 속성만 채운다
  let timer = null;
  const scheduleHints = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const seq = ++hintSeq;
      pendingHints = { seq, apply: (h) => {
        const got = [];
        if (h.due && !touched.due) {
          el("p-due").value = h.due.includes("T") ? h.due : `${h.due}T09:00`;
          got.push(`마감 <b>${h.due.replace("T", " ")}</b>`);
        }
        if (h.priority && !touched.priority) {
          draft.priority = h.priority;
          paintPri();
          got.push(`중요도 <b>${PRI_LABEL[h.priority]}</b>`);
        }
        if (h.tags?.length && !touched.tags) {
          el("p-tags").value = h.tags.join(", ");
          got.push(`태그 <b>${h.tags.join(", ")}</b>`);
        }
        el("p-hint").innerHTML = got.length ? "자동 인식: " + got.join(" · ") : "";
      } };
      bridge.postMessage({ type: "todo.hints", seq, text: `${el("p-title").value}\n${el("p-body").value}` });
    }, 250);
  };
  el("p-body").addEventListener("input", scheduleHints);
  el("p-title").addEventListener("input", scheduleHints);

  /* 이 페이지 안에서 뽑아오기 — 사용자가 입력 위치를 옮겨 다니지 않게 한 곳에 모은다.
     결과가 1건이면 이 페이지 칸을 채우고, 여러 건이면 확인 카드로 넘긴다. */
  const busyMsg = (label) => { el("p-src").innerHTML = `<span class="spin"></span> ${label}`; };
  pageFill = (drafts, raw) => {
    el("p-src").innerHTML = '붙여넣기·이미지 끌어놓기 지원 · <button class="link" id="p-img">이미지 열기</button> · <button class="link" id="p-mail">메일에서 가져오기</button>';
    wireSources();
    if (!drafts.length) { el("p-hint").textContent = raw ? "내용을 읽지 못했어요." : ""; return false; }
    if (drafts.length > 1) return true;            // 확인 카드로 넘긴다
    const d = drafts[0];
    if (!el("p-title").value.trim()) el("p-title").value = d.title ?? "";
    if (d.notes) el("p-body").value = [el("p-body").value, d.notes].filter(Boolean).join("\n");
    if (d.due && !touched.due) el("p-due").value = d.due.includes("T") ? d.due : `${d.due}T09:00`;
    if (d.priority && !touched.priority) { draft.priority = d.priority; paintPri(); }
    if (d.tags?.length && !touched.tags) el("p-tags").value = d.tags.join(", ");
    scheduleHints();
    return false;
  };
  const grabImage = (dataUrl) => {
    busyMsg("이미지에서 내용을 읽는 중…");
    bridge.postMessage({ type: "todo.extract", source: "image", dataUrl, into: "page" });
  };
  function wireSources() {
    el("p-img").addEventListener("click", () => { imageTarget = grabImage; $("file").click(); });
    el("p-mail").addEventListener("click", () => {
      busyMsg("메일에서 할 일을 찾는 중…");
      bridge.postMessage({ type: "todo.extract", source: "gmail", into: "page" });
    });
  }
  wireSources();

  const readImage = (file) => {
    const reader = new FileReader();
    reader.onload = () => grabImage(reader.result);
    reader.readAsDataURL(file);
  };
  el("p-body").addEventListener("paste", (e) => {
    const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith("image/"));
    if (!item) return;             // 텍스트 붙여넣기는 그냥 본문으로 들어간다
    e.preventDefault();
    readImage(item.getAsFile());
  });
  sheet.addEventListener("dragover", (e) => e.preventDefault());
  sheet.addEventListener("drop", (e) => {
    const file = [...(e.dataTransfer?.files ?? [])].find((f) => f.type.startsWith("image/"));
    if (!file) return;
    e.preventDefault();
    readImage(file);
  });

  const close = () => { clearTimeout(timer); pendingHints = null; pageFill = null; sheet.remove(); };
  el("p-cancel").addEventListener("click", close);
  sheet.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

  el("p-ok").addEventListener("click", () => {
    const payload = {
      title: el("p-title").value.trim(),
      notes: el("p-body").value.trim(),
      due: el("p-due").value,
      priority: draft.priority,
      tags: el("p-tags").value.split(",").map((s) => s.trim().replace(/^#/, "")).filter(Boolean),
      status: draft.status,
    };
    if (!payload.title && !payload.notes) return close();
    if (editing) {
      send({ type: "edit", id: existing.id, ...payload });
      if (payload.status !== existing.status) send({ type: "move", id: existing.id, status: payload.status });
      return close();
    }
    // 등록 = AI가 한 번 검토·정리해서 넣는다. 실패해도 입력은 그대로 등록된다.
    el("p-ok").disabled = true;
    el("p-cancel").disabled = true;
    el("p-hint").innerHTML = '<span class="spin"></span> AI가 내용을 정리하는 중…';
    pendingCompose = close;
    bridge.postMessage({ type: "todo.compose", draft: payload });
  });

  setTimeout(() => el("p-title").focus(), 30);
}

let pendingCompose = null;
/** 열려 있는 입력 페이지가 추출 결과를 받아 채우는 콜백. 페이지가 없으면 null. */
let pageFill = null;
/** 파일 선택 결과를 받을 대상 (페이지 안에서 연 경우). */
let imageTarget = null;

/* ── 초안 확인(붙여넣기·이미지·메일 추출) ── */
function showDrafts(drafts, raw) {
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  const rows = drafts.map((d, i) =>
    `<div class="draft" data-i="${i}">` +
    `<input type="checkbox" checked />` +
    `<input type="text" value="${esc(d.title)}" />` +
    (d.priority ? `<span class="pri ${d.priority}">${PRI_LABEL[d.priority]}</span>` : "") +
    `<input type="datetime-local" value="${d.due && d.due.includes("T") ? esc(d.due) : ""}" />` +
    `</div>`).join("");
  sheet.innerHTML =
    `<div><h2>${drafts.length ? `찾은 할 일 ${drafts.length}건 — 확인 후 등록` : "할 일을 찾지 못했어요"}</h2>` +
    `<div class="body">${rows || `<pre>${esc(raw || "")}</pre>`}</div>` +
    `<div class="foot"><span class="grow"></span><button id="d-cancel">닫기</button>` +
    (drafts.length ? `<button id="d-ok" class="active">등록</button>` : "") + `</div></div>`;
  document.body.append(sheet);
  sheet.querySelector("#d-cancel").addEventListener("click", () => sheet.remove());
  sheet.querySelector("#d-ok")?.addEventListener("click", () => {
    const picked = [...sheet.querySelectorAll(".draft")]
      .filter((row) => row.querySelector('input[type=checkbox]').checked)
      .map((row) => {
        const i = +row.dataset.i;
        return {
          title: row.querySelector('input[type=text]').value,
          due: row.querySelector('input[type="datetime-local"]').value,
          priority: drafts[i].priority ?? "",
          tags: drafts[i].tags ?? [],
          notes: drafts[i].notes ?? "",
          source: "extract",
        };
      })
      .filter((t) => t.title.trim());
    if (picked.length) send({ type: "addMany", tasks: picked });
    sheet.remove();
  });
}

/* ── 이벤트 ── */
$("close").addEventListener("click", () => bridge.close());


$("file").addEventListener("change", () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (!file || !imageTarget) return;
  const reader = new FileReader();
  const target = imageTarget;
  imageTarget = null;
  reader.onload = () => target(reader.result);
  reader.readAsDataURL(file);
});

bridge.onMessage((msg) => {
  if (msg?.type === "todo.state") {
    tasks = msg.tasks ?? [];
    focus = msg.focus ?? null;
    focusCollapsed = !!msg.focusCollapsed;
    stats = msg.stats ?? null;
    render();
  }
  if (msg?.type === "todo.hints.result" && pendingHints && msg.seq === pendingHints.seq) {
    pendingHints.apply(msg.hints ?? {});
  }
  if (msg?.type === "todo.composed") {
    pendingCompose?.();
    pendingCompose = null;
  }
  if (msg?.type === "todo.drafts") {


    const drafts = msg.drafts ?? [];
    // 입력 페이지 안에서 부른 추출은 그 페이지를 채운다. 여러 건일 때만 확인 카드로 넘어간다.
    if (msg.into === "page" && pageFill && !pageFill(drafts, msg.raw)) return;
    if (pendingCompose) { pendingCompose(); pendingCompose = null; }
    showDrafts(drafts, msg.raw);
  }
});

bridge.postMessage({ type: "todo.ready" });
</script>
</body>
</html>
